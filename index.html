<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Rating Zone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="manga-header">
        <div class="logo-text">MANGA ZONE</div>
        <nav class="nav-links" id="navLinks">
            <!-- El JS inyecta los botones -->
        </nav>
    </header>

    <!-- LAYOUT PRINCIPAL -->
    <div class="main-layout">

        <!-- COLUMNA IZQUIERDA -->
        <aside class="sidebar">
            <div class="side-box">
                <h3 class="side-title">Último Anime</h3>
                <div id="latestAnime"></div>
            </div>
            <div class="side-box">
                <h3 class="side-title">Último Manga</h3>
                <div id="latestManga"></div>
            </div>
        </aside>

        <!-- COLUMNA CENTRAL -->
        <main class="main-content">
            <section class="search-section">
                <div class="type-switch">
                    <button class="btn-switch active" id="btnManga" onclick="switchType('manga')">Manga</button>
                    <button class="btn-switch" id="btnAnime" onclick="switchType('anime')">Anime</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Buscar..." oninput="handleSearch()">
                </div>
            </section>

            <h2 class="section-title" id="gridTitle">Populares</h2>
            <div class="manga-grid" id="mangaGrid">
                <!-- El JS carga los ítems -->
            </div>
        </main>

        <!-- COLUMNA DERECHA -->
        <aside class="sidebar">
            <div class="side-box">
                <h3 class="side-title">Top 3 Valorados</h3>
                <div id="top3Container"></div>
            </div>
        </aside>

    </div>

    <!-- MODAL DETALLES -->
    <div class="manga-modal" id="detailModal">
        <div class="modal-content modal-large">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <div class="modal-body-grid">
                <div class="modal-left" id="modalLeft"></div>
                <div class="modal-right">
                    <h2 id="modalTitle"></h2>
                    <div id="trailerContainer" style="margin: 15px 0;"></div>
                    <div class="reviews-section">
                        <h3>Reseñas</h3>
                        <div id="reviewsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PERFIL -->
    <div class="manga-modal" id="profileModal">
        <div class="modal-content modal-medium">
            <button class="close-btn" onclick="closeModal('profileModal')">&times;</button>
            <h2>Mi Perfil</h2>
            <form onsubmit="saveUserProfile(event)" style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <input type="text" id="profName" class="manga-input" placeholder="Nombre de usuario">
                <textarea id="profBio" class="manga-textarea" placeholder="Biografía..."></textarea>
                <input type="text" id="profFavAnime" class="manga-input" placeholder="Anime Favorito">
                <input type="text" id="profFavManga" class="manga-input" placeholder="Manga Favorito">
                <button type="submit" class="btn-manga btn-full">Guardar Perfil</button>
            </form>
        </div>
    </div>

    <!-- MODAL AMIGOS -->
    <div class="manga-modal" id="friendsModal">
        <div class="modal-content modal-medium">
            <button class="close-btn" onclick="closeModal('friendsModal')">&times;</button>
            <h2>Amigos</h2>
            <input type="text" id="userSearchInput" class="manga-input" placeholder="Buscar usuarios..." oninput="searchUsers()" style="margin: 15px 0;">
            <div id="userSearchResults"></div>
            <h3 style="margin-top: 20px;">Tus Amigos</h3>
            <div id="friendsList"></div>
        </div>
    </div>

    <!-- MODAL PERFIL AMIGO -->
    <div class="manga-modal" id="friendProfileModal">
        <div class="modal-content modal-medium">
            <button class="close-btn" onclick="closeModal('friendProfileModal')">&times;</button>
            <h2 id="friendProfileName">Perfil de Amigo</h2>
            <div id="friendReviewsList" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- NOTIFICACIONES TOAST -->
    <div id="toastContainer" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>

    <!-- FIREBASE Y SCRIPT -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="script.js"></script>

</body>
</html>
